<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="t d">
  <title id="t">How Glob works</title>
  <desc id="d">1. Tell your coding agent "open glob". 2. Glob opens in your browser on the project the agent works on, with every order on one board. 3. Finished assets land in your game's glob_delivery folder and the agent swaps its placeholder.</desc>
  <style>
    .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, Menlo, monospace; }
    .step { font-size: 12px; letter-spacing: 2px; font-weight: 700; fill: #ff7a9c; }
    .cmd { font-size: 16px; fill: #f6eef3; font-weight: 700; }
    .call { font-size: 14px; fill: #ff7a9c; }
    .ok { font-size: 14px; fill: #c6f432; }
    .dim { font-size: 13px; fill: #7d6a77; }
    .file { font-size: 14px; fill: #f6eef3; }
    .dir { font-size: 14px; fill: #ffb3c6; font-weight: 700; }
    .url { font-size: 11px; fill: #b6a3b0; }
    .col { font-size: 9px; letter-spacing: 1px; fill: #7d6a77; font-weight: 700; }
    .chip { font-size: 12px; letter-spacing: 1.5px; font-weight: 700; fill: #b6a3b0; }
    .chip-on { font-size: 12px; letter-spacing: 1.5px; font-weight: 700; fill: #0b0710; }
    .note { font-size: 13px; fill: #b6a3b0; }
  </style>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#ff7a9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect width="960" height="410" rx="24" fill="#0b0710"/>
  <rect x="0.5" y="0.5" width="959" height="409" rx="24" fill="none" stroke="#2a1a26"/>

  <!-- 1 · tell your agent -->
  <text class="mono step" x="32" y="50">01  TELL YOUR AGENT</text>
  <rect x="32" y="66" width="256" height="240" rx="16" fill="#08060a" stroke="#3a2433"/>
  <circle cx="54" cy="88" r="5" fill="#ff5a6a"/><circle cx="70" cy="88" r="5" fill="#fde047"/><circle cx="86" cy="88" r="5" fill="#c6f432"/>
  <line x1="32" y1="108" x2="288" y2="108" stroke="#2a1a26"/>
  <text class="mono dim" x="52" y="150">&gt;</text><text class="mono cmd" x="70" y="150">open glob</text>
  <text class="mono call" x="52" y="192">→ open_glob()</text>
  <text class="mono ok" x="52" y="230">✓ Glob is up</text>
  <text class="mono dim" x="52" y="256">  on your project</text>

  <path d="M300 186 H340" stroke="#ff7a9c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- 2 · Glob opens on the project -->
  <text class="mono step" x="352" y="50">02  GLOB OPENS</text>
  <rect x="352" y="66" width="256" height="240" rx="16" fill="#150d15" stroke="#3a2433"/>
  <rect x="368" y="80" width="224" height="26" rx="13" fill="#0b0710" stroke="#2a1a26"/>
  <text class="mono url" x="384" y="97">127.0.0.1:8420/?project=kaiju</text>
