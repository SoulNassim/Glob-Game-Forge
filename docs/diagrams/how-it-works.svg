<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">How Glob works</title>
  <desc id="d">You see and shape every order on one Glob board. Your coding agent places orders, Glob delivers finished files into your game, and the agent swaps its placeholder.</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0969da"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #24292f; }
    .muted { fill: #57606a; font-size: 11px; }
    .small { font-size: 9px; fill: #57606a; }
    .mono { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; fill: #0969da; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .arrow { fill: none; stroke: #57606a; stroke-width: 1.6; marker-end: url(#arr); }
    .arrowBlue { fill: none; stroke: #0969da; stroke-width: 1.6; marker-end: url(#arrBlue); }
  </style>

  <!-- background -->
  <rect x="0" y="0" width="960" height="520" rx="16" fill="#f6f8fa"/>

  <!-- You -->
  <rect class="card" x="24" y="40" width="190" height="130" rx="12"/>
  <circle cx="119" cy="66" r="13" fill="#0969da"/>
  <path d="M98 106 Q98 84 119 84 Q140 84 140 106 Z" fill="#0969da"/>
  <text x="119" y="132" text-anchor="middle" font-size="16" font-weight="700">You</text>
  <text class="muted" x="119" y="152" text-anchor="middle">shape art · pick winners</text>

  <!-- Coding agent -->
  <rect class="card" x="24" y="200" width="190" height="130" rx="12"/>
  <text x="119" y="228" text-anchor="middle" font-size="14" font-weight="700">Your coding agent</text>
  <text class="muted" x="119" y="248" text-anchor="middle">Claude Code · Codex · Cursor</text>
  <text class="mono" x="119" y="272" text-anchor="middle">place_order</text>
  <text class="mono" x="119" y="290" text-anchor="middle">update_order</text>

  <!-- Your game -->
  <rect class="card" x="24" y="380" width="190" height="120" rx="12"/>
  <text x="119" y="408" text-anchor="middle" font-size="14" font-weight="700">Your game</text>
  <text class="mono" x="119" y="430" text-anchor="middle">glob_delivery/&lt;order&gt;/</text>
  <text class="muted" x="119" y="450" text-anchor="middle">+ manifest.json · SHA-256</text>

  <!-- Glob board -->
  <rect class="card" x="280" y="40" width="650" height="400" rx="14"/>
  <text x="300" y="66" font-size="16" font-weight="700">Glob · Agent Orders board</text>
  <text class="muted" x="300" y="84">Every order in one place. You see all of it here.</text>
  <rect x="300" y="96" width="620" height="28" rx="14" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="310" y="114" font-size="11" fill="#0969da">Glob agent · sorts drafts · rearranges sections · files orders · just ask it</text>

  <!-- columns -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="296" y="138" width="96" height="24" rx="6" fill="#eaeef2"/><text x="344" y="154">Drafts</text>
    <rect x="400" y="138" width="96" height="24" rx="6" fill="#eaeef2"/><text x="448" y="154">Filed</text>
    <rect x="504" y="138" width="96" height="24" rx="6" fill="#eaeef2"/><text x="552" y="154">In progress</text>
    <rect x="608" y="138" width="96" height="24" rx="6" fill="#eaeef2"/><text x="656" y="154">Ready</text>
    <rect x="712" y="138" width="96" height="24" rx="6" fill="#eaeef2"/><text x="760" y="154">Delivered</text>
    <rect x="816" y="138" width="96" height="24" rx="6" fill="#eaeef2"/><text x="864" y="154">Integrated</text>
  </g>
  <g fill="#f6f8fa">
    <rect x="296" y="168" width="96" height="232" rx="6"/>
    <rect x="400" y="168" width="96" height="232" rx="6"/>
    <rect x="504" y="168" width="96" height="232" rx="6"/>
    <rect x="608" y="168" width="96" height="232" rx="6"/>
    <rect x="712" y="168" width="96" height="232" rx="6"/>
    <rect x="816" y="168" width="96" height="232" rx="6"/>
  </g>

  <!-- order cards -->
  <g class="card">
    <rect x="302" y="180" width="84" height="44" rx="6"/>
    <rect x="302" y="232" width="84" height="44" rx="6"/>
    <rect x="302" y="284" width="84" height="44" rx="6"/>
    <rect x="406" y="180" width="84" height="44" rx="6"/>
    <rect x="510" y="180" width="84" height="44" rx="6"/>
    <rect x="614" y="180" width="84" height="44" rx="6"/>
    <rect x="718" y="180" width="84" height="44" rx="6"/>
    <rect x="822" y="180" width="84" height="44" rx="6"/>
  </g>
  <g font-size="11" font-weight="700">
    <text x="310" y="198">Ash hound</text>
    <text x="310" y="250">Iron axe</text>
    <text x="310" y="302">Moss gate</text>
    <text x="414" y="198">Gate tiles</text>
    <text x="518" y="198">Mochi</text>
    <text x="622" y="198">Hero run</text>
    <text x="726" y="198">Coin pickup</text>
    <text x="830" y="198">Lantern</text>
  </g>
  <g class="small">
    <text x="310" y="212">ordered</text>
    <text x="310" y="264">ordered</text>
    <text x="310" y="316">ordered</text>
    <text x="414" y="212">filed · prompt set</text>
    <text x="518" y="212">generating</text>
    <text x="622" y="212">pick winner</text>
    <text x="726" y="212">copied to game</text>
    <text x="830" y="212">swapped in</text>
  </g>

  <!-- you can shape the board yourself -->
  <text class="muted" x="300" y="422">You: drag cards to rearrange, rename, or ask Glob to do it.</text>

  <!-- arrows -->
  <path class="arrow" d="M214 100 H278"/>
  <text class="small" x="247" y="92" text-anchor="middle">see it all</text>

  <path class="arrow" d="M214 260 H294"/>
  <text class="mono" x="254" y="252" text-anchor="middle" font-size="10">place_order</text>

  <path class="arrowBlue" d="M760 440 V460 H216"/>
  <text class="small" x="480" y="476" text-anchor="middle">delivered: files + manifest.json land in the game</text>

  <path class="arrow" d="M80 380 V334"/>
  <text class="small" x="88" y="360">swap placeholder</text>
</svg>
