id: icon_maker
name: Icon Maker
icon: "🛡️"
description: Create a crisp, high-contrast RPG inventory icon readable at 64x64 with stylized border and transparent padding.
category: 2d
requires_parent: false
budget:
  max_run_usd: 0.40
questions:
  - id: prompt
    prompt: "Icon subject or refinement"
    type: text
    default: "Ornate alchemical health potion icon"
steps:
  - id: render_icon
    action: generate_icon
    provider: gemini
    capability: text_to_image
    params:
      render_mode: icon
      prompt: "{{ inputs.prompt }}"
  - id: qc_icon
    action: qc_check
    depends_on: ["render_icon"]
